name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyflakes websocket-client
      - run: python -m compileall -q ytmini
      - run: python -m pyflakes ytmini
      - run: bash -n launcher.sh && bash -n install.sh
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: for f in ytmini/js/*.js; do node --check "$f" 2>/dev/null || echo "(aviso) $f no es módulo independiente"; done
